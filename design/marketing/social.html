<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoxShift — social preview 1280×640</title>
<link rel="stylesheet" href="../vx.css">
<style>
  body{width:1280px;height:640px;overflow:hidden;position:relative;background:var(--bg)}
  .edge{position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:5}
  .copy{position:absolute;left:72px;top:64px;bottom:60px;width:520px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:36px;height:36px;border-radius:8px}
  .brand span{font-size:22px;font-weight:600;letter-spacing:-.01em}
  h1{font-size:78px;line-height:.95;font-weight:600;letter-spacing:-.045em;margin-top:56px}
  .lead{font-size:22px;line-height:1.4;color:var(--text-2);margin-top:26px;letter-spacing:-.01em}
  .facts{margin-top:auto;display:flex;gap:0;border-top:1px solid var(--line);padding-top:18px}
  .facts div{padding-right:28px;margin-right:28px;border-right:1px solid var(--line)}
  .facts div:last-child{border:0;margin:0}
  .facts b{display:block;font:500 22px var(--mono);letter-spacing:-.02em}
  .facts small{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
  .shot{position:absolute;left:652px;top:72px;width:720px;height:640px;border:1px solid var(--line-2);border-radius:10px 0 0 0;overflow:hidden;background:var(--bg)}
  .shot img{position:absolute;left:0;top:0;width:1120px}
</style>
</head>
<body>
<div class="copy">
  <div class="brand"><img src="../../assets/logo.svg" alt=""><span>VoxShift</span></div>
  <h1>Free AI<br>voice changer</h1>
  <p class="lead">Real-time voices for Discord, OBS and games. Clone your own voice locally. Open source, no account.</p>
  <div class="facts">
    <div><b>~30 ms</b><small>latency</small></div>
    <div><b>250+</b><small>voices</small></div>
    <div><b>MIT</b><small>Win · Mac · Linux</small></div>
  </div>
</div>
<div class="shot"><img src="../../assets/screenshots/live-voice-changer.png" alt=""></div>
<div class="edge"></div>
</body>
</html>
