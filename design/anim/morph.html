<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoxShift — realtime morph loop</title>
<link rel="stylesheet" href="../vx.css">
<style>
  body{width:1280px;height:520px;overflow:hidden}
  .frame{height:100%;display:flex;flex-direction:column;padding:40px 56px 0}
  .top{display:flex;align-items:center;gap:12px}
  .top .logo{width:20px;height:20px;border-radius:4px}
  .top .logo svg{width:14px;height:14px}
  .top .app{font-weight:600;font-size:15px}
  h2{font-size:52px;line-height:1;font-weight:600;letter-spacing:-.04em;margin-top:26px}
  h2 span{color:var(--text-2)}
  .flow{display:grid;grid-template-columns:1fr 210px 1fr;gap:28px;align-items:center;margin-top:52px}
  .side .lbl{display:flex;justify-content:space-between;margin-bottom:12px}
  .side .lane{height:128px}
  .who{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .who b{font-size:30px;font-weight:600;letter-spacing:-.03em}
  .who small{font:12px var(--mono);color:var(--text-2)}
  .src{font-size:30px;font-weight:600;letter-spacing:-.03em;color:var(--text-2);margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
  .src small{font:12px var(--mono);color:var(--text-3)}
  .box{border:1px solid var(--line-2);border-radius:10px;background:var(--panel);padding:22px 16px 20px;text-align:center}
  .box .knob svg{width:84px;height:84px}
  .box .lat{font:500 26px var(--mono);letter-spacing:-.03em;margin-top:6px}
  .box .lat small{font-size:13px;color:var(--text-2);margin-left:3px}
  .box .lbl{display:block}
  .foot{margin-top:auto;height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:28px;font:12px var(--mono);color:var(--text-3)}
  .foot b{color:var(--text-2);font-weight:500}
</style>
</head>
<body>
<div class="frame">
  <div class="top"><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 6v4M8 9v5M12 13v6M16 9v5M20 6v4"/></svg></div><span class="app">VoxShift</span><span class="sp"></span><span class="live lbl" style="color:var(--acc);display:flex;align-items:center;gap:7px"><i style="width:7px;height:7px;border-radius:50%;background:var(--acc);display:block"></i>Live</span></div>
  <h2>Speak normally. <span>Sound like anyone.</span></h2>
  <div class="flow">
    <div class="side">
      <div class="src">You<small>Shure MV7 · 48 kHz</small></div>
      <div class="lane"><svg id="in" preserveAspectRatio="none"></svg></div>
    </div>
    <div class="box">
      <span class="lbl">RVC v3 HD · GPU</span>
      <div class="knob" id="kn"></div>
      <div class="lat"><span id="lat">27</span><small>ms</small></div>
    </div>
    <div class="side">
      <div class="who"><b id="vn">Nova</b><small id="vd">bright female · anime</small></div>
      <div class="lane"><svg id="out" preserveAspectRatio="none"></svg><div class="playhead"></div></div>
    </div>
  </div>
  <div class="foot"><span><b>100% local</b> · no cloud · no account</span><span class="sp"></span><span>Discord · OBS · Steam · VRChat · Zoom</span></div>
</div>
<script>
const TAU = Math.PI * 2, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), frac = x => x - Math.floor(x);
function amp(j, seed, P = 140) {
  const u = j / P;
  let a = Math.abs(Math.sin(TAU * 4 * u + seed) * .55 + Math.sin(TAU * 11 * u + seed * 2) * .3 + Math.sin(TAU * u + seed) * .35 + Math.sin(TAU * 23 * u) * .08);
  const f = frac(u * 2 + seed * .07); if (f > .44 && f < .5) a *= .06;
  return clamp(a, .04, 1);
}
function bars(svg, vals, colorAt, H = 128) {
  const W = 1000, n = vals.length, bw = W / n; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let s = ''; for (let i = 0; i < n; i++) { const h = Math.max(2, vals[i] * H * .92); s += `<rect x="${(i * bw + bw * .2).toFixed(1)}" y="${((H - h) / 2).toFixed(1)}" width="${(bw * .55).toFixed(1)}" height="${h.toFixed(1)}" rx="1.2" fill="${colorAt(i, n)}"/>`; }
  svg.innerHTML = s;
}
function knob(val) {
  const r = 32, c = 42, a0 = 135, sweep = 270;
  const pt = d => { const t = d * Math.PI / 180; return [c + r * Math.cos(t), c + r * Math.sin(t)]; };
  const arc = (f, to) => { const [x1, y1] = pt(f), [x2, y2] = pt(to); return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${to - f > 180 ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  const end = a0 + sweep * val, [px, py] = pt(end);
  return `<svg viewBox="0 0 84 84"><path d="${arc(a0, a0 + sweep)}" stroke="#26262b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="${arc(a0, end)}" stroke="#ff5b1f" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="42" cy="42" r="22" fill="#18181b" stroke="#2c2c31"/><line x1="${(c + (px - c) * .42).toFixed(2)}" y1="${(c + (py - c) * .42).toFixed(2)}" x2="${(c + (px - c) * .64).toFixed(2)}" y2="${(c + (py - c) * .64).toFixed(2)}" stroke="#ececee" stroke-width="2.2" stroke-linecap="round"/></svg>`;
}
const V = [
  { n:'Nova',   d:'bright female · anime',   k:.68 },
  { n:'Titan',  d:'deep, distorted · horror', k:.22 },
  { n:'Unit-7', d:'vocoder robot · sci-fi',  k:.50 },
  { n:'Echo',   d:'airy whisper · ghost',    k:.58 },
];
function shape(a, vi, j) {
  if (vi === 1) return clamp(a * 1.05 + .18 * Math.abs(Math.sin(j * 1.9)));
  if (vi === 2) return Math.max(.04, Math.round(a * 4) / 4);
  if (vi === 3) return a * (.45 + .2 * Math.abs(Math.sin(j * .7)));
  return a;
}
let cur = -1;
window.__seek = (t, dur) => {
  window.__seeking = true;
  const seg = dur / 4, vi = Math.floor(t / seg) % 4, local = (t % seg) / seg;
  if (vi !== cur) { cur = vi; document.getElementById('vn').textContent = V[vi].n; document.getElementById('vd').textContent = V[vi].d; }
  // knob sweeps to the new voice's value at the start of each segment
  const prev = V[(vi + 3) % 4].k, k = prev + (V[vi].k - prev) * (1 - Math.pow(1 - clamp(local / .18), 3));
  document.getElementById('kn').innerHTML = knob(k);
  const N = 70, off = Math.floor(t / dur * N * 2), vin = [], vout = [];
  for (let i = 0; i < N; i++) { const j = i + off; vin.push(amp(j, 1.3, N) * .8); vout.push(shape(amp(j - 1, 1.3, N), vi, j)); }
  bars(document.getElementById('in'), vin, () => '#3a3a40');
  bars(document.getElementById('out'), vout, (i, n) => i > n - 6 ? '#ff5b1f' : '#d9d9de');
  const who = document.querySelector('.who'), o = Math.min(1, local * 7);
  who.style.opacity = o.toFixed(2); who.style.transform = `translateY(${((1 - o) * 6).toFixed(1)}px)`;
  document.getElementById('lat').textContent = 27 + Math.round(Math.sin(TAU * t / dur * 3));
};
window.__seek(600, 6000); window.__seeking = false;
const t0 = performance.now();
(function loop() { if (window.__seeking) return; window.__seek((performance.now() - t0) % 6000, 6000); window.__seeking = false; requestAnimationFrame(loop); })();
</script>
</body>
</html>
