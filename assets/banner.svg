<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">VoxShift — Free AI Voice Changer for Windows, macOS and Linux</title>
  <desc id="d">Real-time AI voice changer with about 30 ms latency, local voice cloning, soundboard and a virtual microphone for Discord, OBS, Twitch and games.</desc>
  <style>
    .b{transform-box:fill-box;transform-origin:center;animation:a 1.4s ease-in-out infinite alternate}
    .b.b{animation-name:bb;animation-duration:1.1s}
    .b.c{animation-name:cc;animation-duration:1.7s}
    @keyframes a{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
    @keyframes bb{0%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
    @keyframes cc{0%{transform:scaleY(.6)}50%{transform:scaleY(1)}100%{transform:scaleY(.3)}}
    .dot{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{opacity:.25}}
  </style>
